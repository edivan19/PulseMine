
name: Sincronizar PulseMine original

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar meu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar com o original
        run: |
          git remote add upstream https://github.com/ArthurLemos8/PulseMine.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit
          git push origin main
